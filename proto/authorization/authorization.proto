syntax = "proto3";

package authorization;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

service AuthorizationService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc UpdateWorkspaceMembers(UpdateWorkspaceMembersRequest) returns (UpdateWorkspaceMembersResponse);
  rpc GetWorkspaceMembers(GetWorkspaceMembersRequest) returns (GetWorkspaceMembersResponse);
  rpc HasWorkspacePermission(HasWorkspacePermissionRequest) returns (HasWorkspacePermissionResponse);
  rpc HasWorkspaceItemPermission(HasWorkspaceItemPermissionRequest) returns (HasWorkspaceItemPermissionResponse);
  rpc GetUserWorkspaceItemPermissions(GetUserWorkspaceItemPermissionsRequest) returns (GetUserWorkspaceItemPermissionsResponse);
}

message CreateWorkspaceRequest {
  string workspace_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message CreateWorkspaceResponse {
  google.protobuf.Empty empty = 1;
}

enum WorkspaceRole {
  WORKSPACE_ROLE_UNSPECIFIED = 0;
  WORKSPACE_ROLE_OWNER = 1;
  WORKSPACE_ROLE_EDITOR = 2;
  WORKSPACE_ROLE_VIEWER = 3;
}

message WorkspaceMember {
  string id = 1 [(buf.validate.field).required = true];
  WorkspaceRole role = 2 [(buf.validate.field).required = true];
}

message UpdateWorkspaceMembersRequest {
  string user_id = 1 [(buf.validate.field).required = true];
  string workspace_id = 2 [(buf.validate.field).required = true];
  repeated WorkspaceMember members = 3 [(buf.validate.field).required = true];
}

message UpdateWorkspaceMembersResponse {
  google.protobuf.Empty empty = 1;
}

message GetWorkspaceMembersRequest {
  string user_id = 1 [(buf.validate.field).required = true];
  string workspace_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message GetWorkspaceMembersResponse {
  repeated WorkspaceMember members = 1 [(buf.validate.field).required = true];
}

enum WorkspacePermission {
  WORKSPACE_PERMISSION_UNSPECIFIED = 0;
  WORKSPACE_PERMISSION_READ = 1;
  WORKSPACE_PERMISSION_EDIT = 2;
  WORKSPACE_PERMISSION_DELETE = 3;
}

message HasWorkspacePermissionRequest {
  string member_id = 1 [(buf.validate.field).required = true];
  string workspace_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
  WorkspacePermission permission = 3 [(buf.validate.field).required = true];
}

message HasWorkspacePermissionResponse {
  bool has_permission = 1 [(buf.validate.field).required = true];
}

enum WorkspaceItemPermission {
  WORKSPACE_ITEM_PERMISSION_UNSPECIFIED = 0;
  WORKSPACE_ITEM_PERMISSION_READ = 1;
  WORKSPACE_ITEM_PERMISSION_WRITE = 2;
  WORKSPACE_ITEM_PERMISSION_DELETE = 3;
}

message HasWorkspaceItemPermissionRequest {
  string member_id = 1 [(buf.validate.field).required = true];
  WorkspaceItemPermission permission = 3 [(buf.validate.field).required = true];
}

message HasWorkspaceItemPermissionResponse {
  bool has_permission = 1 [(buf.validate.field).required = true];
}

message GetUserWorkspaceItemPermissionsRequest {
  string member_id = 1 [(buf.validate.field).required = true];
  string note_id = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message GetUserWorkspaceItemPermissionsResponse {
  bool can_read = 1 [(buf.validate.field).required = true];
  bool can_write = 2 [(buf.validate.field).required = true];
  bool can_delete = 3 [(buf.validate.field).required = true];
}
