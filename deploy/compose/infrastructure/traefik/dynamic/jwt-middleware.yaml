# yaml-language-server: $schema=https://www.schemastore.org/traefik-v3-file-provider.json
http:
  middlewares:
    jwt:
      plugin:
        jwt:
          issuers:
            - issuer: http://authentik.notopia.localhost/application/o/api-web/
              jwks: http://authentik.notopia.localhost/application/o/api-web/jwks/
            - issuer: http://authentik.notopia.localhost/application/o/app-web/
              jwks: http://authentik.notopia.localhost/application/o/app-web/jwks/
          headerMap:
            X-Forwarded-ID: sub
            X-Forwarded-Email: email
            X-Forwarded-Roles: roles
            X-Forwarded-Groups: groups
