# vim:ft=yaml.docker-compose:
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  authorization_postgresql:
    container_name: notopia-authorization_postgresql
    image: postgres:18.1-alpine3.23
    environment:
      POSTGRES_DB: ${AUTHORIZATION_POSTGRESQL_DB:-authorization}
      POSTGRES_USER: ${AUTHORIZATION_POSTGRESQL_USER:-notopiauit}
      POSTGRES_PASSWORD: ${AUTHORIZATION_POSTGRESQL_PASSWORD:-notopiauit}
    ports:
      - ${AUTHORIZATION_POSTGRESQL_PORT:-5439}:5432
    volumes:
      - authorization_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
    restart: unless-stopped

volumes:
  authorization_postgresql_data:
