# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Notopia - Users
  labels:
    blueprint-group: notopia
    blueprints.goauthentik.io/description: |
      User list
entries:
  - model: authentik_core.user
    id: notopiauit
    identifiers:
      username: notopiauit
    attrs:
      name: Notopia Admin
      email: notopiauit@notopia.com
      groups:
        - !Find [authentik_core.group, [name, authentik Admins]]
      password: notopiauit

  - model: authentik_core.user
    id: user
    identifiers:
      pk: 110
    attrs:
      username: user
      name: User
      email: user@notopia.com
      password: user

  - model: authentik_core.user
    id: ntgnguyen
    identifiers:
      pk: 111
    attrs:
      username: ntgnguyen
      name: Nguyen Thai Gia Nguyen
      email: ntgnguyen563@gmail.com
      password: ntgnguyen

  - model: authentik_core.user
    id: kevinnitro
    identifiers:
      pk: 112
    attrs:
      username: kevinnitro
      name: Kevin Nitro
      email: trannguyenthaibinh46@gmail.com
      password: kevinnitro

  - model: authentik_core.user
    id: admin
    identifiers:
      pk: 101
    attrs:
      username: admin
      name: Admin
      email: admin@notopia.com
      password: admin

  - model: authentik_core.token
    identifiers:
      identifier: notopiauit-app-password
    attrs:
      description: Local development app password for notopiauit
      expiring: false
      key: notopiauit
      intent: app_password
      user: !KeyOf notopiauit

  - model: authentik_core.token
    identifiers:
      identifier: user-app-password
    attrs:
      description: Local development app password for user
      expiring: false
      key: notopiauit
      intent: app_password
      user: !KeyOf user

  - model: authentik_core.token
    identifiers:
      identifier: ntgnguyen-app-password
    attrs:
      description: Local development app password for ntgnguyen
      expiring: false
      key: notopiauit
      intent: app_password
      user: !KeyOf ntgnguyen

  - model: authentik_core.token
    identifiers:
      identifier: kevinnitro-app-password
    attrs:
      description: Local development app password for kevinnitro
      expiring: false
      key: notopiauit
      intent: app_password
      user: !KeyOf kevinnitro

  - model: authentik_core.token
    identifiers:
      identifier: admin-app-password
    attrs:
      description: Local development app password for admin
      expiring: false
      key: notopiauit
      intent: app_password
      user: !KeyOf admin

  - model: authentik_core.user
    id: note-service
    identifiers:
      pk: 1001
    attrs:
      username: note-service
      name: Note Service
      type: service_account
      path: goauthentik.io/service-accounts
      password: notopiauit
      groups:
        - !Find [authentik_core.group, [name, authentik Read-only]]
      attributes:
        goauthentik.io/user/token-expires: false

  - model: authentik_core.token
    identifiers:
      identifier: service-account-note-service-password
    attrs:
      description: Token for Note Service
      expires: 9999-12-31T23:59:59Z
      expiring: false
      key: notopiauit
      managed: null
      intent: api
      user: !KeyOf note-service

  - model: authentik_core.user
    id: document-service
    identifiers:
      pk: 1002
    attrs:
      username: document-service
      name: Document Service
      type: service_account
      path: goauthentik.io/service-accounts

  - model: authentik_core.user
    id: billing-service
    identifiers:
      pk: 1003
    attrs:
      username: billing-service
      name: Billing Service
      type: service_account
      path: goauthentik.io/service-accounts

  - model: authentik_core.group
    id: notopia-admins
    identifiers:
      name: notopia-admins
    attrs:
      users:
        - !Find [authentik_core.user, [username, admin]]
