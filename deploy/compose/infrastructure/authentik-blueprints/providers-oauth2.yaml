# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Notopia - Providers Oauth2
  labels:
    blueprint-group: notopia
    blueprints.goauthentik.io/description: |
      Notopia - Providers Oauth2 Settings

entries:
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      scope_name: notopia
    attrs:
      name: "Notopia - OAuth Mapping: gateway header claims"
      scope_name: notopia
      description: "String claims mapped to X-Forwarded-* headers by the gateway"
      expression: | # language: python
        import json
        return {
            "groups_json": json.dumps([group.name for group in request.user.groups.all()]),
            "picture": request.user.attributes.get("avatar_url") or None,
        }
