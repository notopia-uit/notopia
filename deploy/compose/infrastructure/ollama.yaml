# vim:ft=yaml.docker-compose:
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  ai_ollama:
    container_name: notopia-ai_ollama
    image: ${AI_OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: [ai-local-llm]
    ports:
      - "127.0.0.1:${AI_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ai_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  ai_ollama_data:
