apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherType: regex
          matcherRegex: '(?:trace_id|traceid|trace)":"([^"]+)"'
          name: TraceID
          url: '${__value.raw}'

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: true
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        customQuery: false
        datasourceUid: loki
        filterBySpanID: true
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: prometheus

deleteDatasources:
  - name: TestData DB
    orgId: 1
