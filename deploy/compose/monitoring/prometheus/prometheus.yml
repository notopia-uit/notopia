# yaml-language-server: $schema=https://www.schemastore.org/prometheus.json
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: notopia
    environment: dev

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345

  - job_name: docker
    static_configs:
      - targets:
          - host.docker.internal:9323
    relabel_configs:
      - source_labels:
          - __address__
        target_label: instance
