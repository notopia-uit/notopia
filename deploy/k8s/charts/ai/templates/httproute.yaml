# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/784ec895547a36e548e6810b41f27baade3a0890/gateway.networking.k8s.io/httproute_v1.json
{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "notopia-common.fullname" . }}
spec:
  {{- with .Values.route.parentRefs }}
  parentRefs: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.route.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /ai/health }
      {{- if .Values.route.exposeHealth }}
      backendRefs:
        - { name: {{ include "notopia-common.fullname" . }}, port: 8086 }
      {{- end }}
    - matches:
        - path: { type: PathPrefix, value: /ai }
      timeouts:
        request: {{ .Values.route.requestTimeout | quote }}
      backendRefs:
        - { name: {{ include "notopia-common.fullname" . }}, port: 8086 }
{{- end }}
