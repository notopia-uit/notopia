suite: service resources
set: { redis.addr: 'redis:6379', redis.passwordSecret.name: redis, istio.enabled: false }
templates:
  - service.yaml
  - httproute.yaml
  - istio/authorizationpolicy.yaml
  - job-migrate.yaml
  - job-seed.yaml
  - hook-serviceaccount.yaml
tests:
  - it: exposes service ports
    template: service.yaml
    asserts:
      - contains:
          path: spec.ports
          content: { name: grpc, port: 18084, targetPort: grpc, appProtocol: kubernetes.io/h2c }
      - contains:
          path: spec.ports
          content: { name: health, port: 28084, targetPort: health, appProtocol: http }
      - contains:
          path: spec.ports
          content: { name: http, port: 8084, targetPort: http, appProtocol: http }
  - it: omits Istio security policy when disabled
    template: istio/authorizationpolicy.yaml
    set: { istio.enabled: false }
    asserts:
      - hasDocuments: { count: 0 }
  - it: exposes health when enabled
    template: httproute.yaml
    set: { route.enabled: true }
    asserts:
      - equal: { path: 'spec.rules[0].backendRefs[0].port', value: 28084 }
  - it: excludes health when disabled
    template: httproute.yaml
    set: { route.exposeHealth: false }
    asserts:
      - equal: { path: 'spec.rules[0].backendRefs[0].port', value: 8084 }
  - it: configures migrate hook
    template: job-migrate.yaml
    asserts:
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: 'pre-install,pre-upgrade' }
      - equal: { path: 'metadata.annotations["helm.sh/hook-weight"]', value: '-5' }
      - equal: { path: 'metadata.annotations["helm.sh/hook-delete-policy"]', value: before-hook-creation }
      - equal: { path: 'spec.template.spec.containers[0].command', value: ['./billing', migrate, up] }
  - it: configures seed hook
    template: job-seed.yaml
    asserts:
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: 'post-install,post-upgrade' }
      - equal: { path: 'metadata.annotations["helm.sh/hook-weight"]', value: '5' }
      - equal: { path: 'metadata.annotations["helm.sh/hook-delete-policy"]', value: before-hook-creation }
      - equal: { path: 'spec.template.spec.containers[0].command', value: ['./billing', seed] }
  - it: creates migration account before the job and retains it for inspection
    template: hook-serviceaccount.yaml
    asserts:
      - equal: { path: 'metadata.annotations["helm.sh/hook"]', value: 'pre-install,pre-upgrade' }
      - equal: { path: 'metadata.annotations["helm.sh/hook-weight"]', value: '-10' }
      - equal: { path: 'metadata.annotations["helm.sh/hook-delete-policy"]', value: before-hook-creation }
  - it: uses the hook account for migration
    template: job-migrate.yaml
    asserts:
      - equal: { path: spec.template.spec.serviceAccountName, value: RELEASE-NAME-billing-hook }
