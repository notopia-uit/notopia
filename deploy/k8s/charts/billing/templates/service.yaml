apiVersion: v1
kind: Service
metadata:
  name: {{ include "notopia-common.fullname" . }}
  labels:
    {{- include "notopia-common.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "notopia-common.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 8084, targetPort: http, appProtocol: http }
    - { name: grpc, port: 18084, targetPort: grpc, appProtocol: kubernetes.io/h2c }
    - { name: health, port: 28084, targetPort: health, appProtocol: http }
