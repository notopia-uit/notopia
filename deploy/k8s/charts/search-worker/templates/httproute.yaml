# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
{{- if and .Values.route.enabled .Values.route.exposeHealth }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "notopia-common.fullname" . }}
spec:
  {{- with .Values.route.parentRefs }}
  parentRefs: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.route.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.route.exposeHealth }}
    - matches:
        - path: { type: PathPrefix, value: /search-worker/health }
      backendRefs:
        - { name: {{ include "notopia-common.fullname" . }}, port: 28083 }
    {{- end }}
{{- end }}
