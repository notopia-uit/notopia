suite: service contract
set: { redis.addr: 'redis:6379', redis.passwordSecret.name: redis }
templates:
  - deployment.yaml
tests:
  - it: serves with the configured health endpoints
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].command', value: ['./note', serve] }
      - equal: { path: 'spec.template.spec.containers[0].startupProbe.httpGet.path', value: /note/health/startup }
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.httpGet.path', value: /note/health/ready }
      - equal: { path: 'spec.template.spec.containers[0].livenessProbe.httpGet.path', value: /note/health/live }
      - equal: { path: 'spec.template.spec.containers[0].startupProbe.httpGet.port', value: 28081 }
      - contains: { path: 'spec.template.spec.containers[0].ports', content: { name: http, containerPort: 8081, protocol: TCP } }
      - contains: { path: 'spec.template.spec.containers[0].ports', content: { name: grpc, containerPort: 18081, protocol: TCP } }
      - contains: { path: 'spec.template.spec.containers[0].ports', content: { name: health, containerPort: 28081, protocol: TCP } }
