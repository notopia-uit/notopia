# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/service.json
apiVersion: v1
kind: Service
metadata:
  name: {{ include "notopia-common.fullname" . }}
  labels:
    {{- include "notopia-common.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "notopia-common.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: http, appProtocol: http }
