# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment.json
{{- $root := merge (dict) . -}}
{{- $values := deepCopy .Values -}}
{{- $extra := default list $values.extraEnv -}}
{{- $_ := set $values "extraEnv" $extra -}}
{{- $_ := set $root "Values" $values -}}
{{- range .Values.extraVolumes -}}
{{- if eq .name "next-cache" -}}
{{- fail "extraVolumes cannot use reserved name next-cache" -}}
{{- end -}}
{{- end -}}
{{- range .Values.extraVolumeMounts -}}
{{- if eq .mountPath "/app/apps/web/.next/cache" -}}
{{- fail "extraVolumeMounts cannot use reserved mountPath /app/apps/web/.next/cache" -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notopia-common.fullname" $root }}
  labels:
    {{- include "notopia-common.labels" $root | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "notopia-common.selectorLabels" $root | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notopia-common.selectorLabels" $root | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/env: {{ printf "%s%s" (include "notopia-common.env" $root) (toYaml .Values.envFrom) | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "notopia-common.serviceAccountName" $root }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "notopia-common.podSecurityContext" $root | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "notopia-common.image" $root | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "apps/web/server.js"]
          securityContext:
            {{- include "notopia-common.containerSecurityContext" $root | nindent 12 }}
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: 3000 }
          livenessProbe:
            tcpSocket: { port: 3000 }
          env:
            {{- include "notopia-common.env" $root | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: next-cache
              mountPath: /app/apps/web/.next/cache
            {{- with .Values.extraVolumeMounts }}{{- toYaml . | nindent 12 }}{{- end }}
      volumes:
        - name: next-cache
          emptyDir: {}
        {{- with .Values.extraVolumes }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
