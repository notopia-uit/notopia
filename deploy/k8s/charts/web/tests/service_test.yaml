suite: service contract
templates:
  - deployment.yaml
tests:
  - it: serves with the correct command and readiness probe
    asserts:
      - equal: { path: 'spec.template.spec.containers[0].command', value: [node, apps/web/server.js] }
      - equal: { path: 'spec.template.spec.containers[0].readinessProbe.tcpSocket.port', value: 3000 }
