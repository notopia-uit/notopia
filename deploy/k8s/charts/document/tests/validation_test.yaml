suite: shared state guards
templates:
  - deployment.yaml
tests:
  - it: rejects multiple replicas without shared state
    set: { replicaCount: 2 }
    asserts:
      - failedTemplate: {}
  - it: rejects autoscaling without shared state
    set: { autoscaling.enabled: true }
    asserts:
      - failedTemplate: {}
  - it: accepts replicas with shared state
    set:
      replicaCount: 2
      scaling.enabled: true
      scaling.redisUrlSecret.name: redis
      scaling.redisUrlSecret.key: url
    asserts:
      - isKind: { of: Deployment }
  - it: accepts autoscaling with shared state
    set:
      autoscaling.enabled: true
      scaling.enabled: true
      scaling.redisUrlSecret.name: redis
      scaling.redisUrlSecret.key: url
    asserts:
      - isKind: { of: Deployment }
  - it: rejects an incomplete Redis secret
    set:
      replicaCount: 2
      scaling.enabled: true
      scaling.redisUrlSecret.name: redis
      scaling.redisUrlSecret.key: ''
    asserts:
      - failedTemplate: {}
  - it: rejects scaling enabled without a Redis secret
    set: { scaling.enabled: true }
    asserts:
      - failedTemplate: {}
