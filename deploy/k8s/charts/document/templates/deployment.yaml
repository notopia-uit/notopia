{{- $root := merge (dict) . -}}
{{- $values := deepCopy .Values -}}
{{- $extra := default list $values.extraEnv -}}
{{- if and (or (gt (int $values.replicaCount) 1) $values.autoscaling.enabled) (not $values.scaling.enabled) -}}{{ fail "document scaling requires scaling.enabled and a Redis secret" }}{{- end -}}
{{- if and $values.scaling.enabled (or (not $values.scaling.redisUrlSecret.name) (not $values.scaling.redisUrlSecret.key)) -}}{{ fail "scaling.redisUrlSecret.name and key are required" }}{{- end -}}
{{- if $values.scaling.redisUrlSecret.name -}}
{{- if not $values.scaling.redisUrlSecret.key -}}{{ fail "scaling.redisUrlSecret.key is required" }}{{- end -}}
{{- $extra = append $extra (dict "name" "NOTOPIA_DOCUMENT_REDIS_URL" "valueFrom" (dict "secretKeyRef" $values.scaling.redisUrlSecret)) -}}
{{- end -}}
{{- if $values.scaling.enabled -}}{{- $extra = append $extra (dict "name" "NOTOPIA_DOCUMENT_SCALING_ENABLED" "value" "true") -}}{{- end -}}
{{- $_ := set $values "extraEnv" $extra -}}
{{- $_ := set $root "Values" $values -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notopia-common.fullname" $root }}
  labels:
    {{- include "notopia-common.labels" $root | nindent 4 }}
spec:
  strategy:
    type: Recreate
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "notopia-common.selectorLabels" $root | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notopia-common.selectorLabels" $root | nindent 8 }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/env: {{ printf "%s%s" (include "notopia-common.env" $root) (toYaml .Values.envFrom) | sha256sum }}
        {{- with .Values.podAnnotations }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "notopia-common.serviceAccountName" $root }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "notopia-common.podSecurityContext" $root | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: document
          image: {{ include "notopia-common.image" $root | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "main.cjs"]
          securityContext:
            {{- include "notopia-common.containerSecurityContext" $root | nindent 12 }}
          ports:
            - { name: http, containerPort: 8082, protocol: TCP }
          startupProbe:
            httpGet: { path: /document/health/startup, port: 8082 }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /document/health/ready, port: 8082 }
          livenessProbe:
            httpGet: { path: /document/health/live, port: 8082 }
          env:
            {{- include "notopia-common.env" $root | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts: {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
