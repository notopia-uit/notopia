# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-hook" (include "notopia-common.fullname" . | trunc 58 | trimSuffix "-") }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
