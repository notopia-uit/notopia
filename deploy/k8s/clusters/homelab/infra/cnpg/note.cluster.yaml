apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-note
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18
  storage:
    size: 1Gi
  postgresql:
    parameters:
      timezone: ${TIMEZONE}
      log_timezone: ${TIMEZONE}
  bootstrap:
    initdb:
      database: note
      owner: note
  managed:
    services:
      disabledDefaultServices: [ro, r]
