apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-document
spec:
  interval: 12h
  suspend: true
  chart:
    spec:
      chart: valkey
      version: 0.12.1
      sourceRef:
        kind: HelmRepository
        name: valkey
  valuesFrom:
    - kind: ConfigMap
      name: valkey-document-helm-values
