# yaml-language-server: $schema=https://raw.githubusercontent.com/valkey-io/valkey-helm/main/valkey/values.schema.json
fullnameOverride: valkey-note
deploymentStrategy: Recreate
replica:
  enabled: false
persistence:
  enabled: true
  size: 1Gi
extraConfig: |
  maxmemory-policy noeviction
  appendonly yes
auth:
  enabled: true
  usersExistingSecret: valkey-note
  aclUsers:
    default:
      permissions: "~* &* +@all"
      passwordKey: password
