# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey-ai
spec:
  interval: 12h
  suspend: true
  chart:
    spec:
      chart: valkey
      version: 1.0.0
      sourceRef:
        kind: HelmRepository
        name: valkey
  valuesFrom:
    - kind: ConfigMap
      name: valkey-ai-helm-values
