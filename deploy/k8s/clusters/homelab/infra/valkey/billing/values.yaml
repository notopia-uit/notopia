fullnameOverride: valkey-billing
deploymentStrategy: Recreate
replica:
  enabled: false
dataStorage:
  enabled: true
  requestedSize: 1Gi
valkeyConfig: |
  maxmemory-policy noeviction
  appendonly yes
auth:
  enabled: true
  usersExistingSecret: valkey-billing
  aclUsers:
    default:
      permissions: "~* &* +@all"
      passwordKey: password
