image:
  tag: ''
otel:
  endpoint: http://alloy-alloy.monitoring.svc:4317
istio:
  allowedPrincipals:
  - cluster.local/ns/notopia/sa/notopia-edge-istio
envFrom:
- secretRef:
    name: document
route:
  enabled: true
  parentRefs:
  - name: notopia-edge
    kind: Gateway
  hostnames:
  - notopia-api.${PUBLIC_DOMAIN}
env:
  NOTOPIA_DOCUMENT_API_URL: https://notopia-api.${PUBLIC_DOMAIN}
  NOTOPIA_DOCUMENT_SERVICES_NOTE_GRPC_URL: note:18081
  NOTOPIA_DOCUMENT_SERVICES_AUTHORIZATION_GRPC_URL: authorization:18089
  NOTOPIA_DOCUMENT_SERVICES_BILLING_GRPC_URL: billing:18084
  NOTOPIA_DOCUMENT_AUTHENTICATION_JWKS_URLS: http://authentik-server.authentik/application/o/app-web/jwks/
extraEnv:
- name: NOTOPIA_DOCUMENT_DB_HOST
  valueFrom:
    secretKeyRef:
      name: cnpg-document-app
      key: host
- name: NOTOPIA_DOCUMENT_DB_PORT
  valueFrom:
    secretKeyRef:
      name: cnpg-document-app
      key: port
- name: NOTOPIA_DOCUMENT_DB_USER
  valueFrom:
    secretKeyRef:
      name: cnpg-document-app
      key: username
- name: NOTOPIA_DOCUMENT_DB_PASSWORD
  valueFrom:
    secretKeyRef:
      name: cnpg-document-app
      key: password
- name: NOTOPIA_DOCUMENT_DB_NAME
  valueFrom:
    secretKeyRef:
      name: cnpg-document-app
      key: dbname
