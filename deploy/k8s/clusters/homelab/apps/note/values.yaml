image:
  tag: ''
otel:
  endpoint: http://alloy-alloy.monitoring.svc:4317
istio:
  allowedPrincipals:
  - cluster.local/ns/notopia/sa/notopia-edge-istio
  - cluster.local/ns/notopia/sa/document
database:
  urlSecret:
    name: cnpg-note-app
    key: uri
redis:
  addr: valkey-note:6379
  passwordSecret:
    name: valkey-note
    key: password
envFrom:
- secretRef:
    name: note
route:
  enabled: true
  parentRefs:
  - name: notopia-edge
    kind: Gateway
  hostnames:
  - notopia-api.${PUBLIC_DOMAIN}
env:
  NOTOPIA_NOTE_SERVER_URL: https://notopia-api.${PUBLIC_DOMAIN}
  NOTOPIA_NOTE_SERVICES_AUTHORIZATION_URL: authorization:18089
  NOTOPIA_NOTE_SERVICES_AUTHORIZATION_LIVE_URL: http://authorization:28089/authorization/health/live
  NOTOPIA_NOTE_SERVICES_BILLING_URL: billing:18084
  NOTOPIA_NOTE_SERVICES_BILLING_LIVE_URL: http://billing:28084/billing/health/live
  NOTOPIA_NOTE_MEILISEARCH_HOST: http://meilisearch:7700
  NOTOPIA_NOTE_MEILISEARCH_NOTE_SEARCH_KEY_UID: 00000000-0000-4000-8000-000000000001
  NOTOPIA_NOTE_AUTHENTIK_HOST: authentik.${PUBLIC_DOMAIN}
