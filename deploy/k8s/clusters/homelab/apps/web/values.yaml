image:
  tag: ''
otel:
  endpoint: http://alloy-alloy.monitoring.svc:4318
  protocol: http/protobuf
istio:
  allowedPrincipals:
  - cluster.local/ns/istio-system/sa/default-istio
envFrom:
- secretRef:
    name: web
route:
  parentRefs:
  - name: default
    namespace: istio-system
    kind: Gateway
    sectionName: https-wildcard
  - name: default
    namespace: istio-system
    kind: Gateway
    sectionName: https-wildcard-local
  hostnames:
  - notopia.${PUBLIC_DOMAIN}
  - notopia.${LOCAL_DOMAIN}
env:
  API_URL: https://notopia-api.${PUBLIC_DOMAIN}
  BETTER_AUTH_URL: https://notopia.${PUBLIC_DOMAIN}
  DOCUMENT_WS_URL: wss://notopia-api.${PUBLIC_DOMAIN}/document/ws/document
  AUTHENTIK_CLIENT_DISCOVERY_URL: https://authentik.${PUBLIC_DOMAIN}/application/o/app-web/.well-known/openid-configuration
  AUTHENTIK_REDIRECT_URI: https://notopia.${PUBLIC_DOMAIN}/api/auth/callback/authentik
  MEILISEARCH_HOST: https://notopia-meilisearch.${PUBLIC_DOMAIN}
