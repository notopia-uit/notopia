apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web
spec:
  suspend: true
  interval: 12h
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/k8s/charts/web
      sourceRef:
        kind: GitRepository
        name: notopia
        namespace: flux-system
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: true
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: web-helm-values
