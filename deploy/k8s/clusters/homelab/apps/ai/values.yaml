# yaml-language-server: $schema=../../../../charts/ai/values.schema.json
image:
  tag: 'dev-2611.21.0712'
otel:
  endpoint: http://alloy-alloy.monitoring.svc:4317
istio:
  allowedPrincipals:
    - cluster.local/ns/notopia/sa/notopia-edge-istio
route:
  enabled: true
  parentRefs:
    - name: notopia-edge
      kind: Gateway
  hostnames:
    - notopia-api.${PUBLIC_DOMAIN}
  requestTimeout: 150s
env:
  NOTOPIA_AI_SERVICES_NOTE_GRPC_URL: note:18081
  NOTOPIA_AI_SERVICES_AUTHORIZATION_GRPC_URL: authorization:18089
  NOTOPIA_AI_SERVICES_BILLING_GRPC_URL: billing:18084
  NOTOPIA_AI_MEILI_HOST: http://meilisearch:7700
  NOTOPIA_AI_LLM_BASE_URL: https://provider.example.invalid/v1
  NOTOPIA_AI_LLM_MODEL: replace-before-use
extraEnv:
  - name: NOTOPIA_AI_REDIS_URL
    valueFrom:
      secretKeyRef: {name: ai, key: NOTOPIA_AI_REDIS_URL}
  - name: NOTOPIA_AI_LLM_API_KEY
    valueFrom:
      secretKeyRef: {name: ai, key: NOTOPIA_AI_LLM_API_KEY}
  - name: NOTOPIA_AI_MEILI_API_KEY
    valueFrom:
      secretKeyRef: {name: ai, key: NOTOPIA_AI_MEILI_API_KEY}
