# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: notopia-edge
spec:
  suspend: true
  interval: 12h
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/k8s/charts/notopia-edge
      sourceRef:
        kind: GitRepository
        name: notopia
        namespace: flux-system
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
      remediateLastFailure: true
      strategy: rollback
  valuesFrom:
  - kind: ConfigMap
    name: notopia-edge-helm-values
