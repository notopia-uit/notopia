# yaml-language-server: $schema=https://www.schemastore.org/tmuxinator.json
name: notopia svcs prod

windows:
  - svcs prod:
      layout: tiled
      panes:
        - note:
            - tmux set-option -w pane-border-status top
            - mise exec -- nx run note --no-tui --configuration=production
        - authorization:
            - mise exec -- nx run authorization --no-tui --configuration=production
        - document:
            - mise exec -- nx run document --no-tui --configuration=production
        - search-worker:
            - mise exec -- nx run search-worker --no-tui --configuration=production
