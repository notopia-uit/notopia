# yaml-language-server: $schema=https://www.schemastore.org/sqlc-2.0.json
version: '2'

sql:
  - engine: postgresql
    schema:
      - ../../internal/note/infra/persistence/pgmigration/
      - ../../internal/note/infra/persistence/pgsqlc/temp_tables.sql
    queries: ../../internal/note/infra/persistence/pgsqlc/
    gen:
      go:
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
        emit_pointers_for_null_types: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        out: ../../internal/note/infra/persistence/pgsqlc/
        sql_driver: github.com/jackc/pgx/v5
        sql_package: pgx/v5
        initialisms:
          - id
          - url
        rename:
          source_ids: SourceIDs
          target_ids: TargetIDs
    rules:
      - sqlc/db-prepare
      - postgresql-query-too-costly
      - postgresql-no-seq-scan

overrides:
  go:
    rename:
      ids: IDs
      urls: URLs
      status_ids: StatusIDs
    overrides:
      - db_type: uuid
        nullable: false
        go_type:
          import: github.com/google/uuid
          type: UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      - db_type: timestamptz
        nullable: false
        go_type:
          import: time
          type: Time
          pointer: false
      # https://github.com/sqlc-dev/sqlc/issues/3276
      # not work
      - db_type: trashed_by
        nullable: true
        go_type:
          type: string
          pointer: true

rules:
  - name: postgresql-query-too-costly
    message: Query cost estimate is too high
    rule: postgresql.explain.plan.total_cost > 1.0
  - name: postgresql-no-seq-scan
    message: Query plan results in a sequential scan
    rule: postgresql.explain.plan.node_type == 'Seq Scan'
  - name: debug
    rule: '!has(postgresql.explain)'
