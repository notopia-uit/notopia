# vim: ft=yaml.openapi
get:
  security:
    - oauth2: []
  tags:
    - edit
  summary: WebSocket for editing a document
  description: Establish a WebSocket connection for real-time collaborative editing of a document.
  operationId: wsEditsDocument
  parameters:
    - $ref: ../components/parameters/documentIdPath.yaml
  responses:
    101:
      description: Switching Protocols - WebSocket connection established.
    200:
      description: OK
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
