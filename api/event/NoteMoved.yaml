# vim: ft=yaml.openapi
type: object
properties:
  noteId:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174000
  noteTitle:
    type: string
    example: Meeting Notes
  fromFolderId:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174001
  fromFolderName:
    type: string
    example: Job
  toFolderId:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174002
  toFolderName:
    type: string
    example: Personal
  actorId:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174003
  actorName:
    type: string
    example: johndoe
  occurredAt:
    type: string
    format: date-time
    example: 2024-06-15T13:45:30Z
required:
  - noteId
  - fromFolderId
  - toFolderId
  - actorId
  - occurredAt
