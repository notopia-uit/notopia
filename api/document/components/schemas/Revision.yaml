# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 000c2575-1847-5293-8117-2415a2328ef8
    readOnly: true

  name:
    type: string
    nullable: true
    minLength: 1
    maxLength: 255
    example: Initial Draft

  createdAt:
    type: string
    format: date-time
    example: 2024-01-01T12:00:00Z
    readOnly: true

required:
  - id
  - name
  - createdAt
