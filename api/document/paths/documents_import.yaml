# vim: ft=yaml.openapi
post:
  security:
    - Oauth2: []
  tags:
    - Document
  summary: Import documents
  operationId: importDocuments
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
  responses:
    201:
      description: Successfully imported documents
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
