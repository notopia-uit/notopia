# vim: ft=yaml.openapi
get:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Document
  summary: Get document attachment upload url
  description: Get presigned URL for document attachment upload
  operationId: getDocumentAttachmentUploadUrl
  parameters:
    - $ref: ../components/parameters/documentIdPath.yaml
  responses:
    200:
      description: Presigned URL
      content:
        application/json:
          schema:
            type: object
            properties:
              uploadUrl:
                type: string
                format: uri
                example: http://rustfs-api.notopia.localhost/document/upload-url
              url:
                type: string
                format: uri
                example: http://rustfs-api.notopia.localhost/document/document-attachments/d4c6b66a-03a8-486d-a139-ab72635c009b/a64cb105-4924-4441-8611-bbc91bbaa1b9
            required:
              - uploadUrl
              - url
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
