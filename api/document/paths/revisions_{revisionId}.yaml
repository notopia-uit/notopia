# vim: ft=yaml.openapi
get:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Revision
  summary: Get revision with content
  operationId: getRevisionWithContent
  parameters:
    - $ref: ../components/parameters/revisionIdPath.yaml
  responses:
    200:
      description: Revision retrieved successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionWithContent.yaml
          example:
            $ref: ../components/examples/DocumentContent.json
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml

delete:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Revision
  summary: Delete revision
  operationId: deleteRevision
  parameters:
    - $ref: ../components/parameters/revisionIdPath.yaml
  responses:
    204:
      description: Revision deleted successfully
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
