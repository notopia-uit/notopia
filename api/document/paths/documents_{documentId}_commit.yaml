# vim: ft=yaml.openapi
post:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Document
  summary: Commit document
  operationId: commitDocument
  parameters:
    - $ref: ../components/parameters/documentIdPath.yaml
  responses:
    200:
      description: Nothing changed since the last revision; returns the latest revision
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CommittedRevision.yaml
    201:
      description: Document revision committed successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CommittedRevision.yaml
    204:
      description: Nothing changed and the document has no revision yet
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
