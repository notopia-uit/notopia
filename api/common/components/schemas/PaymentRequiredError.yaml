# vim: ft=yaml.openapi
description: |
  Error for a request blocked by the workspace plan. `code` is one of:
  - `featureNotInPlan` (details.kind=feature): the feature is not included in the plan
  - `planLimitExceeded` (details.kind=limit): the plan's usage limit has been reached
allOf:
  - $ref: ./Error.yaml
  - type: object
    properties:
      details:
        type: object
        properties:
          kind:
            type: string
            enum: [feature, limit]
            example: limit
          key:
            type: string
            example: members
          current:
            type: integer
            format: int64
            example: 5
          max:
            type: integer
            format: int64
            example: 5
          requiredPlan:
            type: string
            enum: [plus, pro]
            example: plus
        required: [kind, key, requiredPlan]
