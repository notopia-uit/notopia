# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: integer
    description: User ID from Authentik (need to change subject mode to User's ID instead of hashed)
    minimum: 1
    example: 10

  username:
    type: string
    description: Username from Authentik
    example: johndoe

  name:
    type: string
    description: Full name from Authentik
    example: John Doe
    nullable: true

  email:
    type: string
    format: email
    description: Email from Authentik
    example: john.doe@example.com
    nullable: true

required:
  - id
  - username
  - name
  - email
