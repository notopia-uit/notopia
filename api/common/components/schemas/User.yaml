# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    description: User ID from Authentik (need to change subject mode to User's ID instead of hashed)
    examples: ["100"]

  username:
    type: string
    description: Username from Authentik
    examples: [user]

  name:
    type: [string, "null"]
    description: Full name from Authentik
    examples: [User]

  email:
    type: [string, "null"]
    format: email
    description: Email from Authentik
    examples: [user@notopia.com]

required:
  - id
  - username
  - name
  - email
