# vim: ft=yaml.openapi
type: object
properties:
  page:
    type: integer
    description: Current page number, starting from 1
    minimum: 1
    example: 1
  currentTotal:
    type: integer
    description: Number of items in the current page
    minimum: 0
    example: 20
  total:
    type: integer
    description: Total items across all pages
    minimum: 0
    example: 100
  totalPages:
    type: integer
    description: Total number of pages
    minimum: 0
    example: 5
  hasNext:
    type: boolean
    description: Whether there is a next page
    example: true
  hasPrev:
    type: boolean
    description: Whether there is a previous page
    example: false
required:
  - page
  - currentTotal
  - total
  - totalPages
  - hasNext
  - hasPrev
