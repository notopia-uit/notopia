# vim: ft=yaml.openapi
type: object
properties:
  page:
    type: integer
    description: Current page number, starting from 1
    minimum: 1
    examples: [1]
  currentTotal:
    type: integer
    description: Number of items in the current page
    minimum: 0
    examples: [20]
  total:
    type: integer
    description: Total items across all pages
    minimum: 0
    examples: [100]
  totalPages:
    type: integer
    description: Total number of pages
    minimum: 0
    examples: [5]
  hasNext:
    type: boolean
    description: Whether there is a next page
    examples: [true]
  hasPrev:
    type: boolean
    description: Whether there is a previous page
    examples: [false]
required:
  - page
  - currentTotal
  - total
  - totalPages
  - hasNext
  - hasPrev
