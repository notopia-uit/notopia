# vim: ft=yaml.openapi
type: object
properties:
  code:
    type: string
    description: Error code
    examples: [EXAMPLE_CODE]
  message:
    type: string
    description: Human-readable error message
    examples: [Example error]
  more_info:
    type: string
    description: URL with more information about the error
    examples: [https://api.notopia.com/docs/errors/EXAMPLE_CODE]
required:
  - code
  - message
