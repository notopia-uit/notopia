# vim: ft=yaml.openapi
type: object
properties:
  id:
    type: string
    format: uuid
    examples: [0192f0a0-0000-7000-8000-000000000003]
  plan:
    $ref: ./PlanTier.yaml
  interval:
    $ref: ./BillingInterval.yaml
  status:
    $ref: ./SubscriptionStatus.yaml
  currentPeriodStart:
    type: [string, "null"]
    format: date-time
    examples: [2026-10-11T00:00:00Z]
  currentPeriodEnd:
    type: [string, "null"]
    format: date-time
    examples: [2026-11-11T00:00:00Z]
  cancelAtPeriodEnd:
    type: boolean
    examples: [false]
  canceledAt:
    type: [string, "null"]
    format: date-time
    examples: [2026-10-20T00:00:00Z]
  accessUntil:
    type: [string, "null"]
    format: date-time
    examples: [2026-11-11T00:00:00Z]
  refunds:
    type: array
    items:
      $ref: ./Refund.yaml
required: [id, plan, interval, status, cancelAtPeriodEnd, refunds]
