# vim: ft=yaml.openapi
type: object
properties:
  id:
    type: string
    format: uuid
    examples: [00000000-0000-4000-8000-000000000201]
  plan:
    $ref: ./PlanTier.yaml
  interval:
    $ref: ./BillingInterval.yaml
  status:
    $ref: ./SubscriptionStatus.yaml
  currentPeriodStart:
    type: [string, "null"]
    format: date-time
    examples: [2026-11-22T08:50:14Z]
  currentPeriodEnd:
    type: [string, "null"]
    format: date-time
    examples: [2026-12-22T08:50:14Z]
  cancelAtPeriodEnd:
    type: boolean
    examples: [false]
  canceledAt:
    type: [string, "null"]
    format: date-time
    examples: [null]
  accessUntil:
    type: [string, "null"]
    format: date-time
    examples: [2026-12-22T08:50:14Z]
  refunds:
    type: array
    examples: [[]]
    items:
      $ref: ./Refund.yaml
required: [id, plan, interval, status, currentPeriodStart, currentPeriodEnd, cancelAtPeriodEnd, canceledAt, accessUntil, refunds]
