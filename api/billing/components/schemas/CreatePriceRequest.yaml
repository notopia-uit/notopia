# vim: ft=yaml.openapi
type: object
properties:
  plan:
    type: string
    enum: [plus, pro]
    examples: [plus]
  interval:
    $ref: ./BillingInterval.yaml
  amount:
    type: integer
    format: int64
    minimum: 1
    examples: [49000]
  currency:
    type: string
    examples: [vnd]
required: [plan, interval, amount, currency]
