# vim: ft=yaml.openapi
type: object
properties:
  id:
    type: string
    format: uuid
    example: 0192f0a0-0000-7000-8000-000000000001
  plan:
    $ref: ./PlanTier.yaml
  interval:
    $ref: ./BillingInterval.yaml
  amount:
    type: integer
    format: int64
    example: 49000
  currency:
    type: string
    example: vnd
  lookupKey:
    type: string
    example: plus_month
  active:
    type: boolean
    example: true
  createdAt:
    type: string
    format: date-time
    example: 2026-10-11T00:00:00Z
  archivedAt:
    type: string
    format: date-time
    nullable: true
    example: 2026-10-12T00:00:00Z
required: [id, plan, interval, amount, currency, lookupKey, active, createdAt]
