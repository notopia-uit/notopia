# vim: ft=yaml.openapi
type: object
properties:
  amount:
    type: integer
    format: int64
    examples: [24500]
  currency:
    type: string
    examples: [vnd]
  unusedSeconds:
    type: integer
    format: int64
    examples: [1296000]
  periodSeconds:
    type: integer
    format: int64
    examples: [2592000]
  payments:
    type: array
    description: One line per paid invoice payment of the current period
    items:
      $ref: ./RefundQuotePayment.yaml
required: [amount, currency, unusedSeconds, periodSeconds, payments]
