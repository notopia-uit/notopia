# vim: ft=yaml.openapi
type: object
properties:
  amount:
    type: integer
    format: int64
    examples: [29500]
  currency:
    type: string
    examples: [vnd]
  unusedSeconds:
    type: integer
    format: int64
    examples: [1296000]
  periodSeconds:
    type: integer
    format: int64
    examples: [2592000]
  payments:
    type: array
    description: >
      Refund breakdown by eligible paid invoice payment whose invoice coverage
      overlaps the current subscription period. A payment's coverage may differ
      from the current period, for example after a plan change.
    examples:
      - - paidAmount: 49000
          amount: 24500
          coverageSeconds: 2592000
          unusedSeconds: 1296000
        - paidAmount: 10000
          amount: 5000
          coverageSeconds: 1296000
          unusedSeconds: 648000
    items:
      $ref: ./RefundQuotePayment.yaml
required: [amount, currency, unusedSeconds, periodSeconds, payments]
