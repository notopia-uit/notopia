# vim: ft=yaml.openapi
get:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - WorkspaceBilling
  summary: Get workspace billing
  description: Requires workspace billing-management permission. Returns the workspace's subscription, payer, and refund information.
  operationId: getWorkspaceBilling
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  responses:
    200:
      description: Workspace billing state
      content:
        application/json:
          schema:
            $ref: ../components/schemas/WorkspaceBilling.yaml
          examples:
            freeWorkspace:
              $ref: ../examples/getWorkspaceBillingFreeWorkspace.yaml
            plusWorkspace:
              $ref: ../examples/getWorkspaceBillingPlusWorkspace.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
