# vim: ft=yaml.openapi
post:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - WorkspaceBilling
  summary: Claim payer role
  description: Requires workspace billing-management permission. Returns a URL to redirect the browser to Stripe Checkout to set up a payment method and become the workspace payer.
  operationId: claimPayer
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  responses:
    200:
      description: Checkout session URL. Redirect the browser to this URL to set up a payment method.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RedirectURL.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    409:
      description: Conflict with current billing state
      content:
        application/json:
          schema:
            $ref: ../../common/components/schemas/Error.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
