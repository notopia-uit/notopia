# vim: ft=yaml.openapi
post:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - WorkspaceBilling
  summary: Create checkout session
  description: Requires workspace billing-management permission. Returns a URL to redirect the browser to Stripe Checkout to purchase the selected active price.
  operationId: createCheckoutSession
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  requestBody:
    required: true
    content:
      application/json:
          schema:
            $ref: ../components/schemas/CheckoutSessionRequest.yaml
          examples:
            plusMonthlyCheckout:
              $ref: ../examples/createCheckoutSessionPlusMonthlyCheckout.yaml
  responses:
    200:
      description: Checkout session URL. Redirect the browser to this URL to complete the purchase.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RedirectURL.yaml
          examples:
            checkoutSession:
              $ref: ../examples/createCheckoutSessionCheckoutSession.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    409:
      description: Conflict with current billing state
      content:
        application/json:
          schema:
            $ref: ../../common/components/schemas/Error.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
