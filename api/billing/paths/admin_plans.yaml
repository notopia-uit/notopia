# vim: ft=yaml.openapi
get:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - BillingAdmin
  summary: List plans (admin)
  operationId: adminListPlans
  responses:
    200:
      description: Plans
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Plan.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
