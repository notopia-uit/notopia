# vim: ft=yaml.openapi
post:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - BillingAdmin
  summary: Archive a price (admin)
  operationId: adminArchivePrice
  parameters:
    - $ref: ../components/parameters/priceIdPath.yaml
  responses:
    200:
      description: Archived price
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Price.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
