# vim: ft=yaml.openapi
post:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - WorkspaceBilling
  summary: Create portal session
  description: Requires workspace billing-management permission and an existing billing account. Returns a URL to redirect the browser to the Stripe Customer Portal to manage existing billing.
  operationId: createPortalSession
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  responses:
    200:
      description: Customer Portal session URL. Redirect the browser to this URL to manage existing billing.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RedirectURL.yaml
          examples:
            customerPortalSession:
              $ref: ../examples/createPortalSessionCustomerPortalSession.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
