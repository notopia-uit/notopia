# vim: ft=yaml.openapi
post:
  security:
    - Oauth2: []
  tags:
    - Workspace
  summary: Change workspace slug
  operationId: changeWorkspaceSlug
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            slug:
              $ref: ../components/schemas/Workspace.yaml#/properties/slug
          required:
            - slug
  responses:
    204:
      description: Workspace slug changed successfully
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
