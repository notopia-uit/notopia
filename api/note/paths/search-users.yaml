# vim: ft=yaml.openapi
get:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - NoteUser
  summary: Search users
  operationId: searchUsers
  parameters:
    - name: keyword
      in: query
      description: |
        Search keyword.
        In authentik, it may search based on username, email, full name, but not user ID (PK).
      required: true
      schema:
        type: string
        example: user
    - name: isActive
      in: query
      description: If provided, the search will be limited to (in)active users
      schema:
        type: boolean
    - $ref: ../../common/components/parameters/limitQuery.yaml
    - name: excludeMemberInWorkspaceId
      in: query
      description: |
        If provided, the search will be exclude users who are members of the specified workspace.
        Note that this will peform after getting users from identity provider, so it doesn't conform the `limit` parameter.
      schema:
        $ref: ../components/schemas/Workspace.yaml#/properties/id
  responses:
    200:
      description: A list of workspace members
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../common/components/schemas/User.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
