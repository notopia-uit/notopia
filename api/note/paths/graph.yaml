# vim: ft=yaml.openapi
get:
  security:
    - Oauth2: []
  tags:
    - Graph
  summary: Get graph
  operationId: getGraph
  parameters:
    - name: noteIds
      in: query
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 46f94d4d-41b5-4df6-bf8d-270fb9a49c97
    - name: folderIds
      in: query
      schema:
        type: array
        items:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
    - name: depth
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 3
        example: 3
    - name: orphan
      in: query
      description: Include node that are not connected to any other node
      schema:
        type: boolean
        default: false
        example: true
  responses:
    200:
      $ref: ../components/responses/GetGraphResponse.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
