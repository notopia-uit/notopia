# vim: ft=yaml.openapi
get:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Workspace
  summary: Get workspace members
  operationId: getWorkspaceMembers
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  responses:
    200:
      description: A list of workspace members
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/WorkspaceMember.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml

put:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Workspace
  summary: Update workspace members
  description: "Plan limit `members` (free 3, plus 10, pro unlimited). Adding beyond the limit returns 402. The billing payer cannot lose the owner role while a recurring subscription is active (409 `billingPayerMustTransfer`)."
  operationId: updateWorkspaceMembers
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../components/schemas/WorkspaceMember.yaml
  responses:
    204:
      description: Workspace members updated successfully
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    402:
      $ref: ../../common/components/responses/PaymentRequired.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    409:
      description: The billing payer must transfer the owner role before it can be removed while a recurring subscription is active
      content:
        application/json:
          schema:
            $ref: ../../common/components/schemas/Error.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
    503:
      description: Billing service unavailable
      content:
        application/json:
          schema:
            $ref: ../../common/components/schemas/Error.yaml
          example:
            code: SERVICE_UNAVAILABLE
            message: Billing service unavailable. Please try again later
            more_info: https://api.notopia.com/docs/errors/SERVICE_UNAVAILABLE
