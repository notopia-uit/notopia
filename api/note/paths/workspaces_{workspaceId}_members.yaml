# vim: ft=yaml.openapi
get:
  security:
    - Oauth2: []
  tags:
    - Workspace
  summary: Get workspace members
  operationId: getWorkspaceMembers
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  responses:
    200:
      description: A list of workspace members
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/WorkspaceMember.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml

put:
  security:
    - Oauth2: []
  tags:
    - Workspace
  summary: Update workspace members
  operationId: updateWorkspaceMembers
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../components/schemas/WorkspaceMember.yaml
  responses:
    204:
      description: Workspace members updated successfully
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
