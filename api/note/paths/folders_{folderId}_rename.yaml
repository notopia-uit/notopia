# vim: ft=yaml.openapi
post:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Folder
  summary: Rename folder
  operationId: renameFolder
  parameters:
    - $ref: ../components/parameters/folderIdPath.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              $ref: ../components/schemas/Folder.yaml#/properties/name
          required:
            - name
  responses:
    204:
      description: Folder renamed successfully
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
