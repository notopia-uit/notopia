# vim: ft=yaml.openapi
get:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Note
  summary: Get note links
  operationId: getNoteLinks
  parameters:
    - $ref: ../components/parameters/noteIdPath.yaml
    - name: outgoingLinks
      in: query
      required: false
      schema:
        type: boolean
        default: true
    - name: backlinks
      in: query
      required: false
      schema:
        type: boolean
        default: true
  responses:
    200:
      description: Note links
      content:
        application/json:
          schema:
            type: object
            properties:
              outgoingLinks:
                type: array
                items:
                  $ref: ../components/schemas/NoteLink.yaml
              backlinks:
                type: array
                items:
                  $ref: ../components/schemas/NoteLink.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
