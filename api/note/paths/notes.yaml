# vim: ft=yaml.openapi
post:
  security:
    - Oauth2: []
  tags:
    - Note
  summary: Create note
  operationId: createNote
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Note.yaml
  responses:
    201:
      description: Note successfully created
      headers:
        Content-Location:
          required: true
          schema:
            type: string
            format: uri
            example: http://api.notopia.localhost/notes/note/000c2575-1847-5293-8117-2415a2328ef8
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
