# vim: ft=yaml.openapi
post:
  security:
    - Oauth2: []
  tags:
    - Note
  summary: Create note
  operationId: createNote
  requestBody:
    $ref: ../components/requestBodies/CreateNoteRequest.yaml
  responses:
    201:
      $ref: ../components/responses/CreateNoteResponse.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml

get:
  security:
    - Oauth2: []
  tags:
    - Note
  summary: Get notes
  operationId: getNotes
  parameters:
    - $ref: ../../common/components/parameters/pageQuery.yaml
    - $ref: ../../common/components/parameters/limitQuery.yaml
    - name: tags
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
          example: work
  responses:
    200:
      $ref: ../components/responses/GetNotesResponse.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
