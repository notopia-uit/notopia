# vim: ft=yaml.openapi
post:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Workspace
  summary: Create workspace
  operationId: createWorkspace
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/Workspace.yaml
  responses:
    201:
      description: Workspace successfully created
      headers:
        Content-Location:
          required: true
          schema:
            type: string
            format: uri
            example: http://api.notopia.localhost/workspaces/00000000-0000-4000-8000-000000000110
      content:
        application/json:
          schema:
            type: object
            x-go-type-name: CreateWorkspaceResponse
            properties:
              id:
                $ref: ../components/schemas/Workspace.yaml#/properties/id
            required:
              - id
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
