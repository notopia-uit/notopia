# vim: ft=yaml.openapi
post:
  security:
    - Oauth2: []
  tags:
    - Workspace
  summary: Rename workspace
  operationId: renameWorkspace
  parameters:
    - $ref: ../components/parameters/workspaceSlugPath.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              $ref: ../components/schemas/Workspace.yaml#/properties/name
          required:
            - name
  responses:
    204:
      description: Workspace renamed successfully
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
