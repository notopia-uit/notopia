# vim: ft=yaml.openapi
get:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Note
  summary: Get note
  operationId: getNote
  parameters:
    - $ref: ../components/parameters/noteIdPath.yaml
    - name: includeTrashed
      in: query
      required: false
      schema:
        type: boolean
        default: true
  responses:
    200:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Note.yaml
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml

delete:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Note
  summary: Permanently delete note
  operationId: permanentlyDeleteNote
  parameters:
    - $ref: ../components/parameters/noteIdPath.yaml
  responses:
    204:
      description: Note successfully deleted
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    403:
      $ref: ../../common/components/responses/ForbiddenError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
