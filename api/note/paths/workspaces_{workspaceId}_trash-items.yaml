# vim: ft=yaml.openapi
post:
  security:
    - Oauth2:
        - openid
    - OIDC:
        - openid
  tags:
    - Workspace
  summary: Trash workspace's items
  operationId: trashWorkspaceItems
  parameters:
    - $ref: ../components/parameters/workspaceIdPath.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            noteIds:
              type: array
              items:
                type: string
                format: uuid
                example: 000c2575-1847-5293-8117-2415a2328ef8
            folderIds:
              type: array
              items:
                type: string
                format: uuid
                example: 123e4567-e89b-12d3-a456-426614174000
  responses:
    204:
      description: Workspace items successfully trashed
    400:
      $ref: ../../common/components/responses/BadRequestError.yaml
    401:
      $ref: ../../common/components/responses/UnauthorizedError.yaml
    404:
      $ref: ../../common/components/responses/NotFoundError.yaml
    500:
      $ref: ../../common/components/responses/InternalServerError.yaml
