## yaml-language-server: $schema=https://www.schemastore.org/openapi-3.X.json
# vim: ft=yaml.openapi
openapi: 3.0.4

servers:
  - url: http://api.notopia.localhost
    description: Local dev server via gateway
  - url: http://localhost:8081
    description: Local dev/mock server direct

info:
  description: >
    Notopia API - A comprehensive note-taking service API.
  version: 0.0.0
  title: Notopia API
  license:
    name: MIT
    url: https://github.com/notopia-uit/notopia/blob/main/LICENSE
  contact:
    name: Notopia Support
    email: kevinnitro@duck.com

tags:
  - name: Workspace
    description: Workspace
  - name: Folder
    description: Folder in workspace
  - name: Note
    description: Note in workspace's root folder or in a folder
  - name: Revision
    description: Note revisions
  - name: Graph
    description: Note graph

paths:
  /note/folders:
    $ref: ./paths/folders.yaml
  /note/folders/{folderId}/rename:
    $ref: ./paths/folders_{folderId}_rename.yaml

  /note/graph:
    $ref: ./paths/graph.yaml

  /note/notes:
    $ref: ./paths/notes.yaml
  /note/notes/generate-daily:
    $ref: ./paths/notes_generate-daily.yaml
  /note/notes/random:
    $ref: ./paths/notes_random.yaml
  /note/notes/search-tags:
    $ref: ./paths/notes_search-tags.yaml
  /note/notes/{noteId}:
    $ref: ./paths/notes_{noteId}.yaml
  /note/notes/{noteId}/publish:
    $ref: ./paths/notes_{noteId}_publish.yaml
  /note/notes/{noteId}/rename:
    $ref: ./paths/notes_{noteId}_rename.yaml
  /note/notes/{noteId}/unpublish:
    $ref: ./paths/notes_{noteId}_unpublish.yaml
  /note/revisions:
    $ref: ./paths/revisions.yaml
  /note/revisions/{revisionId}/rename:
    $ref: ./paths/revisions_{revisionId}_rename.yaml
  /note/revisions/{revisionId}:
    $ref: ./paths/revisions_{revisionId}.yaml

  /note/workspaces:
    $ref: ./paths/workspaces.yaml
  /note/workspaces/{workspaceId}:
    $ref: ./paths/workspaces_{workspaceId}.yaml
  /note/workspaces/{workspaceId}/events:
    $ref: ./paths/workspaces_{workspaceId}_events.yaml
  /note/workspaces/{workspaceId}/publish:
    $ref: ./paths/workspaces_{workspaceId}_publish.yaml
  /note/workspaces/{workspaceId}/rename:
    $ref: ./paths/workspaces_{workspaceId}_rename.yaml
  /note/workspaces/{workspaceId}/restore-trashed-items:
    $ref: ./paths/workspaces_{workspaceId}_restore-trashed-items.yaml
  /note/workspaces/{workspaceId}/show-trash:
    $ref: ./paths/workspaces_{workspaceId}_show-trash.yaml
  /note/workspaces/{workspaceId}/trash-items:
    $ref: ./paths/workspaces_{workspaceId}_trash-items.yaml
  /note/workspaces/{workspaceId}/unpublish:
    $ref: ./paths/workspaces_{workspaceId}_unpublish.yaml
  /note/workspaces/{workspaceId}/update-collaborators:
    $ref: ./paths/workspaces_{workspaceId}_update-collaborators.yaml

components:
  securitySchemes:
    oauth2:
      $ref: ../common/components/securitySchemes/Oauth2.yaml

externalDocs:
  url: https://notopia-uit.github.io/notopia
