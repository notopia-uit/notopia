# yaml-language-server: $schema=https://www.schemastore.org/openapi-overlay-1.X.json
overlay: 1.0.0
info:
  title: Inject User Info Headers
  version: 1.0.0
x-speakeasy-jsonpath: rfc9535
actions:
  - target: $..[?(@.security)]
    update:
      parameters:
        - name: X-Forwarded-ID
          in: header
          required: true
          description: Injected by Gateway
          schema:
            type: string
          x-go-name: UserID
        - name: X-Forwarded-Email
          in: header
          required: true
          description: Injected by Gateway
          schema:
            type: string
          x-go-name: UserEmail
        - name: X-Forwarded-Groups
          in: header
          required: false
          description: Injected by Gateway
          schema:
            type: string
          x-go-name: UserGroups
        - name: X-Forwarded-Roles
          in: header
          required: false
          description: Injected by Gateway
          schema:
            type: string
          x-go-name: UserRoles
