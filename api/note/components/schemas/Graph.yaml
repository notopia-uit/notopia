# vim: ft=yaml.openapi
type: object

properties:
  nodes:
    type: array
    items:
      type: object
      x-go-type-name: GraphNode
      properties:
        id:
          type: string
          description: Can be either a note ID or a hashtag prefixed tag name
          example: 000c2575-1847-5293-8117-2415a2328ef8
        name:
          type: string
          description: Can be either a note name or a tag name (no hashtag prefix)
          example: PowerUp.ps1
        type:
          type: string
          enum:
            - note
            - tag
          example: note
        weight:
          type: number
          description: Optional weight for the note node, rounded to 1 decimal place
          multipleOf: 0.1
          minimum: 0.5
          maximum: 1
          example: 0.8
      required:
        - id
        - name
        - type

  links:
    type: array
    items:
      type: object
      x-go-type-name: GraphLink
      properties:
        source:
          type: string
          description: The ID of the source node (note id or hashtag prefixed tag name)
          example: 000c2575-1847-5293-8117-2415a2328ef8
        target:
          type: string
          description: The ID of the target node (note id or hashtag prefixed tag name)
          example: '#socks4'

      required:
        - source
        - target

required:
  - nodes
  - links
