# vim:ft=yaml.openapi
type: object

allOf:
  - $ref: ./FolderRequired.yaml
  - type: object
    properties:
      children:
        type: array
        items:
          $ref: ./FolderWithRelations.yaml
      parentId:
        type: string
        format: uuid
        nullable: true
        example: 123e4567-e89b-12d3-a456-426614174000
      notes:
        type: array
        items:
          $ref: ../schemas/NoteRequired.yaml
    required:
      - children
      - parentId
      - notes
