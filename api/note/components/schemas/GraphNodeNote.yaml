# vim: ft=yaml.openapi
type: object

properties:
  type:
    type: string
    enum: [note]
    example: note

  data:
    type: object
    properties:
      id:
        $ref: ./Note.yaml#/properties/id

      name:
        $ref: ./Note.yaml#/properties/name

      weight:
        type: number
        maximum: 1
        minimum: 0
        example: 0.5

    required:
      - id
      - name
      - weight

required:
  - type
  - data
