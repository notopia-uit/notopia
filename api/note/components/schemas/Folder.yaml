# vim:ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174000
    readOnly: true

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Work Notes

  icon:
    type: string
    nullable: true
    example: 📁

  updatedAt:
    type: string
    format: date-time
    example: 2024-06-01T12:00:00Z
    readOnly: true

  parentId:
    $ref: ./Folder.yaml#/properties/id
    example: cc7a2e47-6267-4c60-8d36-257f849777e4

  workspaceId:
    $ref: ./Workspace.yaml#/properties/id
    readOnly: false

required:
  - id
  - name
  - icon
  - updatedAt
  - parentId
  - workspaceId
