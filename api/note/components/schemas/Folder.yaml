# vim:ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    examples: [123e4567-e89b-12d3-a456-426614174000]
    readOnly: true

  name:
    type: string
    minLength: 1
    maxLength: 255
    examples: [Work Notes]

  icon:
    type: [string, "null"]
    examples: [📁]

  parentId:
    type: [string, "null"]
    format: uuid
    examples: [cc7a2e47-6267-4c60-8d36-257f849777e4]

  # This ref to ./Workspace.yaml#/properties/id
  workspaceId:
    type: string
    format: uuid
    examples: [00000000-0000-4000-8000-000000000110]

  updatedAt:
    type: string
    format: date-time
    examples: [2024-06-01T12:00:00Z]
    readOnly: true

  trashed:
    type: [object, "null"]
    readOnly: true
    x-go-type-name: FolderTrashed
    properties:
      by:
        $ref: ./TrashedBy.yaml

      at:
        type: string
        format: date-time
        examples: [2024-06-01T12:00:00Z]

    required:
      - by
      - at

required:
  - id
  - name
  - icon
  - parentId
  - workspaceId
  - updatedAt
  - trashed
