# vim:ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174000
    readOnly: true

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Work Notes

  parentId:
    type: string
    format: uuid
    nullable: true
    example: null

  deletedBy:
    type: string
    enum:
      - purpose
      - parent
    nullable: true
    example: null
    readOnly: true

  deletedAt:
    type: string
    nullable: true
    format: date-time
    example: null
    readOnly: true
