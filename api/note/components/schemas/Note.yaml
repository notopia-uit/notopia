# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 46f94d4d-41b5-4df6-bf8d-270fb9a49c97
    readOnly: true

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Meeting Notes

  folderId:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174000

  currentRevision:
    $ref: ./Revision.yaml
    readOnly: true

required:
  - id
  - name
  - folderId
  - currentRevision
