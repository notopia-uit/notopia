# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 46f94d4d-41b5-4df6-bf8d-270fb9a49c97
    readOnly: true

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Meeting Notes

  icon:
    type: string
    nullable: true
    example: 📓

  folderId:
    $ref: ./Folder.yaml#/properties/id

  tags:
    type: array
    items:
      type: string
    example:
      - work
      - meeting

  content:
    $ref: ./NoteContent.yaml
    nullable: true

  backlinksCount:
    type: integer
    minimum: 0
    example: 5
    readOnly: true

  outgoingLinksCount:
    type: integer
    minimum: 0
    example: 3
    readOnly: true

required:
  - id
  - name
  - icon
  - folderId
  - tags
  - backlinksCount
  - outgoingLinksCount
