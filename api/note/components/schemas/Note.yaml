# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 46f94d4d-41b5-4df6-bf8d-270fb9a49c97
    readOnly: true

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Meeting Notes

  icon:
    type: string
    nullable: true
    example: 📓

  folderId:
    $ref: ./Folder.yaml#/properties/id

  tags:
    type: array
    items:
      type: string
    example:
      - work
      - meeting

  updatedAt:
    type: string
    format: date-time
    example: 2024-06-01T12:34:56Z
    readOnly: true

  trashed:
    type: object
    nullable: true
    readOnly: true
    x-go-type-name: NoteTrashed
    properties:
      trashedBy:
        $ref: ./TrashedBy.yaml

      trashedAt:
        type: string
        format: date-time
        example: 2024-06-01T12:00:00Z

    required:
      - trashedBy
      - trashedAt

required:
  - id
  - name
  - icon
  - folderId
  - tags
  - updatedAt
  - trashed
