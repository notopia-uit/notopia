# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 000c2575-1847-5293-8117-2415a2328ef8
    readOnly: true

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: PowerUp.ps1
    description: Can be empty string when creating but will be set to "Untitled Note" internally

  icon:
    type: string
    nullable: true
    example: 📓

  folderId:
    $ref: ./Folder.yaml#/properties/id

  tags:
    type: array
    items:
      type: string
    example:
      - work
      - meeting
    readOnly: true

  updatedAt:
    type: string
    format: date-time
    example: 2024-06-01T12:34:56Z
    readOnly: true

  trashed:
    type: object
    nullable: true
    readOnly: true
    x-go-type-name: NoteTrashed
    properties:
      by:
        $ref: ./TrashedBy.yaml

      at:
        type: string
        format: date-time
        example: 2024-06-01T12:00:00Z

    required:
      - by
      - at

required:
  - id
  - name
  - icon
  - folderId
  - tags
  - updatedAt
  - trashed
