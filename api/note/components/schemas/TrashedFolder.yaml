# vim:ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174000

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Work Notes
    readOnly: true

  trashedBy:
    $ref: ./TrashedBy.yaml
    nullable: false

  trashedAt:
    type: string
    format: date-time
    example: 2024-06-01T12:00:00Z
    readOnly: true

required:
  - id
  - name
  - trashedBy
  - trashedAt
