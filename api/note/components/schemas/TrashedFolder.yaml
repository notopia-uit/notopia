# vim:ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 123e4567-e89b-12d3-a456-426614174000

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Work Notes
    readOnly: true

  deletedBy:
    $ref: ./TrashedDeletedBy.yaml

  deletedAt:
    type: string
    nullable: true
    format: date-time
    example: null
    readOnly: true

required:
  - id
  - name
  - deletedBy
  - deletedAt
