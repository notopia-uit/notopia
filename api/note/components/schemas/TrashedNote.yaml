# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 46f94d4d-41b5-4df6-bf8d-270fb9a49c97

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Meeting Notes
    readOnly: true

  trashed:
    $ref: ./Trashed.yaml

required:
  - id
  - name
  - trashed
