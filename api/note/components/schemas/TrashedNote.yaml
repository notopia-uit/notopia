# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 000c2575-1847-5293-8117-2415a2328ef8

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: PowerUp.ps1
    readOnly: true

  trashed:
    $ref: ./Trashed.yaml

required:
  - id
  - name
  - trashed
