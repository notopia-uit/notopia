# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 46f94d4d-41b5-4df6-bf8d-270fb9a49c97

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Meeting Notes
    readOnly: true

  trashedBy:
    $ref: ./TrashedBy.yaml
    nullable: false

  trashedAt:
    type: string
    format: date-time
    example: 2024-06-01T12:00:00Z
    readOnly: true

required:
  - id
  - name
  - trashedBy
  - trashedAt
