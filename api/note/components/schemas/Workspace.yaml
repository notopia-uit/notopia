# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid
    example: 00000000-0000-4000-8000-000000000110
    readOnly: true

  slug:
    type: string
    example: notopia

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Notopia

required:
  - id
  - slug
  - name
