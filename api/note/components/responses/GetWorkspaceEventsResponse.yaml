# vim: ft=yaml.openapi
description: A persistent stream of events
content:
  text/event-stream:
    # TODO: Note/Folder restore, permanent deletion
    schema:
      oneOf:
        - $ref: ../schemas/FolderCreatedEvent.yaml
        - $ref: ../schemas/FolderDeletedEvent.yaml
        - $ref: ../schemas/FolderUpdatedEvent.yaml
        - $ref: ../schemas/NoteUpdatedEvent.yaml
        - $ref: ../schemas/NoteCreatedEvent.yaml
        - $ref: ../schemas/NoteDeletedEvent.yaml
        - $ref: ../schemas/WorkspaceUpdatedEvent.yaml
      discriminator:
        propertyName: type
        mapping:
          FolderCreatedEvent: ../schemas/FolderCreatedEvent.yaml
          FolderDeletedEvent: ../schemas/FolderDeletedEvent.yaml
          FolderUpdatedEvent: ../schemas/FolderUpdatedEvent.yaml
          NoteUpdatedEvent: ../schemas/NoteUpdatedEvent.yaml
          NoteCreatedEvent: ../schemas/NoteCreatedEvent.yaml
          NoteDeletedEvent: ../schemas/NoteDeletedEvent.yaml
          WorkspaceUpdatedEvent: ../schemas/WorkspaceUpdatedEvent.yaml
