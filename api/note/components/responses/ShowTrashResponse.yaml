# vim: ft=yaml.openapi
description: Trash
content:
  application/json:
    schema:
      type: object
      properties:
        data:
          type: object
          properties:
            notes:
              type: array
              items:
                $ref: ../schemas/TrashedNote.yaml
            folders:
              type: array
              items:
                $ref: ../schemas/TrashedFolder.yaml
        pagination:
          $ref: ../../../common/components/schemas/Pagination.yaml
      required:
        - data
        - pagination
