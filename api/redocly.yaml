---
# yaml-language-server: $schema=https://raw.githubusercontent.com/Redocly/redocly-cli/refs/heads/main/docs/%40v1/configuration/schema.yaml
apis:
  note:
    root: ./note/openapi.yaml
    output: ./bundled/note.json
  document:
    root: ./document/openapi.yaml
    output: ./bundled/document.json
  share:
    root: ./share/openapi.yaml
    output: ./bundled/share.json
    rules:
      struct: off
      no-empty-servers: off
      scalar-property-missing-example: off
extends:
  - recommended
rules:
  no-server-example.com: off
  scalar-property-missing-example: error
