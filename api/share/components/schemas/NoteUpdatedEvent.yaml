# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid

  workspaceId:
    type: string
    format: uuid

  name:
    type: string

  icon:
    type: [string, "null"]

  folderId:
    type: string
    format: uuid

  folderName:
    type: string

  trashed:
    oneOf:
      - $ref: ../../../note/components/schemas/Trashed.yaml
      - type: "null"

  updatedAt:
    type: string
    format: date-time

required:
  - id
  - workspaceId
  - name
  - icon
  - folderId
  - folderName
  - trashed
  - updatedAt
