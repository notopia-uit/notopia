# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid

  workspaceId:
    type: string
    format: uuid

  name:
    type: string

  icon:
    type: string
    nullable: true

  folderId:
    type: string
    format: uuid

  folderName:
    type: string

  # This should be nullable, but oapi codegen cannot
  # So, we decided to not make it required instead
  trashed:
    $ref: ../../../note/components/schemas/Trashed.yaml

  updatedAt:
    type: string
    format: date-time

required:
  - id
  - workspaceId
  - name
  - icon
  - folderId
  - folderName
  - updatedAt
