# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    example: 46f94d4d-41b5-4df6-bf8d-270fb9a49c97

  name:
    type: string
    minLength: 1
    maxLength: 255
    example: Meeting Notes

  plainTextContent:
    type: string
    description: Plain text content
    example: This is the content of the note

  tags:
    type: array
    items:
      type: string
    example: ['tag1', 'tag2']

required:
  - id
  - name
  - plainTextContent
