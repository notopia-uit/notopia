# vim: ft=yaml.openapi
type: object

properties:
  id:
    type: string
    format: uuid

  workspaceId:
    type: string
    format: uuid

  folderId:
    type: string
    format: uuid

  folderName:
    type: string

  name:
    type: string

  plainTextContent:
    type: string
    description: Plain text content

  tags:
    type: array
    items:
      type: string

  trashed:
    oneOf:
      - $ref: ../../../note/components/schemas/Trashed.yaml
      - type: "null"

required:
  - id
  - workspaceId
  - folderId
  - folderName
  - name
  - plainTextContent
  - tags
  - trashed
