# vim: ft=yaml.openapi
type: object

properties:
  workspaceId:
    $ref: ../../../note/components/schemas/Workspace.yaml#/properties/id

  userId:
    $ref: ../../../common/components/schemas/User.yaml#/properties/id

  # This should ref, just because oapi-codegen doesn't merging nullable
