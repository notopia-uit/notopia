#:schema https://raw.githubusercontent.com/jdx/mise/refs/heads/main/schema/mise.json

[tools]
"github:pressly/goose" = "3.27.0"
"go:github.com/goforj/wire/cmd/wire" = "v1.1.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.6.0"
buf = "1.65.0"
sqlc = "1.30.0"
java = "latest"
"npm:@kevinnitro/nx-cache-action" = "0.1.0"
mockery = "3.7.0"

[shell_alias]
nx = "pnpm exec nx"
shadcn = "pnpm exec shadcn"
tsgo = "pnpm exec tsgo"

[settings]
legacy_version_file = false
