#:schema https://raw.githubusercontent.com/jdx/mise/refs/heads/main/schema/mise.json

[env]
REDOCLY_TELEMETRY = "off"
REDOCLY_SUPPRESS_UPDATE_NOTICE = "true"
NEXT_TELEMETRY_DISABLED = 1
MISE_EXPERIMENTAL = 1
'_'.path.paths = ["./scripts/"]

[tools]
helm = "3.22.1"
"github:dadav/helm-schema" = "0.24.0"
"github:norwoodj/helm-docs" = "1.14.2"
"github:yannh/kubeconform" = "0.8.0"
yq = "4.54.1"
"pipx:codecov-cli" = "11.2.8"
"github:pressly/goose" = "3.27.3"
"go:github.com/goforj/wire/cmd/wire" = "1.3.1"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.8.2"
buf = "1.65.0"
sqlc = "1.31.1"
java = "26.0.1"
"npm:@kevinnitro/nx-cache-action" = { version = "0.1.1", allow_low_downloads = true }
mockery = "3.8.1"
d2 = "0.7.1"
python = "3.13.18"
uv = "0.11.33"
gotestsum = "1.13.0"
"go:github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter" = "0.1.0"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"github:pseudomuto/protoc-gen-doc" = "1.5.1"
"npm:ts-proto" = "2.12.4"
node = "26.13.0"

[shell_alias]
nx = "pnpm exec nx"
shadcn = "pnpm exec shadcn"

[settings]
legacy_version_file = false

[tasks.helm-setup]
description = "Install the pinned Helm unittest plugin"
run = "helm plugin list | grep -qE '^unittest[[:space:]]+1\\.2\\.1([[:space:]]|$)' || { helm plugin list | grep -qE '^unittest[[:space:]]' && helm plugin uninstall unittest; helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.2.1; }"
