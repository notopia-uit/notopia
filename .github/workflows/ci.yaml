name: CI

on:
  push:
    branches:
      - "**"
    paths: &pushPaths
      - "**"
      - "!.agents/**/*"
      - "!.dockerignore"
      - "!.editorconfig"
      - "!.eslintignore"
      - "!.gitattributes"
      - "!.gitignore"
      - "!.harper-dictionary.txt"
      - "!.husky/**/*"
      - "!.lazy.lua"
      - "!.nvim.lua"
      - "!.renovaterc.json"
      - "!.vscode/**/*"
      - "!.wakatime-project"
      - "!README.md"
      - "!deploy/compose/**/*"
      - "!mise.toml"
      - "!**/*/AGENTS.md"
      - "!**/*/CLAUDE.md"
  pull_request:
    branches:
      - "**"
    paths: *pushPaths
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      noRestoreDocsDiagramsCache:
        description: No restore docs diagrams cache
        required: true
        default: false
        type: boolean
      resetNxCache:
        description: Reset Nx cache
        required: true
        default: false
        type: boolean
      nxAllCmd:
        description: Nx All command to run
        required: true
        default: affected
        type: choice
        options:
          - affected
          - run-many
      skipNxCache:
        description: Skip Nx cache
        required: true
        default: false
        type: boolean
      releaseWeb:
        description: Release "web" container
        required: true
        default: false
        type: boolean
      releaseNote:
        description: Release "note" container
        required: true
        default: false
        type: boolean
      releaseAuthorization:
        description: Release "authorization" container
        required: true
        default: false
        type: boolean
      releaseBilling:
        description: Release "billing" container
        required: true
        default: false
        type: boolean
      releaseDocument:
        description: Release "document" container
        required: true
        default: false
        type: boolean
      releaseSearchWorker:
        description: Release "search-worker" container
        required: true
        default: false
        type: boolean
      releaseNpm:
        description: Release NPM packages
        required: true
        default: false
        type: boolean
      releaseAll:
        description: Release all containers and npm packages (Use this or the above specific release options, not both)
        required: true
        default: false
        type: boolean
      releaseContainerType:
        type: choice
        description: Container Release Type
        options:
          - development
          - production
        default: development
        required: true
env:
  MISE_OVERRIDE_CONFIG_FILENAMES: .mise.ci.toml
  NX_PARALLEL: 3
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
      packages: write
      id-token: write
    outputs:
      page-affected: ${{ steps.page-affected.outputs.affected }}
    steps:
      - name: Setup Variables
        id: setup-vars
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_WEB: ${{ github.event.inputs.releaseWeb }}
          INPUT_RELEASE_NOTE: ${{ github.event.inputs.releaseNote }}
          INPUT_RELEASE_AUTHORIZATION: ${{ github.event.inputs.releaseAuthorization }}
          INPUT_RELEASE_BILLING: ${{ github.event.inputs.releaseBilling }}
          INPUT_RELEASE_DOC: ${{ github.event.inputs.releaseDocument }}
          INPUT_RELEASE_SW: ${{ github.event.inputs.releaseSearchWorker }}
          INPUT_RELEASE_NPM: ${{ github.event.inputs.releaseNpm }}
          INPUT_RELEASE_ALL: ${{ github.event.inputs.releaseAll }}
        run: |
          if [[ "$HEAD_REF" == renovate/* ]] || [[ "$REF_NAME" == renovate/* ]]; then
            IS_RENOVATE=true
          else
            IS_RENOVATE=false
          fi

          echo "IS_RENOVATE=$IS_RENOVATE" >> "$GITHUB_OUTPUT"
          echo "NX_CACHE_ACTION_SKIP_UPLOAD_CACHE=$IS_RENOVATE" >> "$GITHUB_OUTPUT"

          if [[ "$IS_RENOVATE" == false ]] && [[ "$REF_NAME" == "main" || "$REF_NAME" == "dev" || "$BASE_REF" == "main" || "$BASE_REF" == "dev" ]]; then
            echo "SHOULD_CACHE=true" >> "$GITHUB_OUTPUT"
          else
            echo "SHOULD_CACHE=false" >> "$GITHUB_OUTPUT"
          fi

          SHOULD_RELEASE=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$REF_NAME" == "main" ]]; then
            if [[ "$INPUT_RELEASE_ALL" == "true" || "$INPUT_RELEASE_WEB" == "true" || "$INPUT_RELEASE_NOTE" == "true" || "$INPUT_RELEASE_AUTHORIZATION" == "true" || "$INPUT_RELEASE_BILLING" == "true" || "$INPUT_RELEASE_DOC" == "true" || "$INPUT_RELEASE_SW" == "true" || "$INPUT_RELEASE_NPM" == "true" ]]; then
              SHOULD_RELEASE=true
            fi
          fi
          echo "SHOULD_RELEASE=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      # - name: Get token
      #   id: get-bot-token
      #   if: ${{ steps.setup-vars.outputs.SHOULD_RELEASE == 'true' }}
      #   uses: actions/create-github-app-token@v2
      #   with:
      #     private-key: ${{ secrets.NOTOPIA_BOT_PRIVATE_KEY }}
      #     app-id: ${{ vars.NOTOPIA_BOT_APP_ID }}
      #     owner: ${{ github.repository_owner }}
      #     repositories: |
      #       ${{ github.event.repository.name }}
      #       infra

      - name: Setup Git User
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: ${{ steps.setup-vars.outputs.SHOULD_CACHE }}
          golangci: "true"

      - name: Detect Page Affected
        id: page-affected
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          projects="$(pnpm exec nx show projects --affected --with-target deployPage --json)"
          if [ "$(jq length <<< "$projects")" -gt 0 ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nx reset cache
        if: ${{ github.event.inputs.resetNxCache == 'true' }}
        run: pnpm exec nx reset

      - name: Nx all
        env:
          NX_CACHE_ACTION_SKIP_UPLOAD_CACHE: ${{ steps.setup-vars.outputs.NX_CACHE_ACTION_SKIP_UPLOAD_CACHE }}
        run: |
          nx-cache-action -- \
          pnpm exec nx ${{ github.event.inputs.nxAllCmd || 'affected' }} \
            --target format:check \
            --target gen \
            --target typecheck \
            --target lint \
            --target bundle \
            --target build \
            --target test \
            --target upload-codecov \
            --exclude=docs,page \
            --parallel=${{env.NX_PARALLEL }} \
            --configuration 'production' \
            ${{ github.event.inputs.skipNxCache == 'true' && '--skipNxCache' || '' }}

      - name: Check chart versions
        run: bash scripts/check-chart-versions.sh "$NX_BASE" "$NX_HEAD"

      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        if: always()
        with:
          report-path: "./coverage/**/ctrf.json"
          github-report: true
          summary-delta-report: true
          insights-report: true
          flaky-rate-report: true
          fail-rate-report: true
          slowest-report: true
          upload-artifact: true
          pull-request-report: true

      - name: Check for changes after Build/Gen
        run: |
          git add .
          if ! git diff --staged --color=always --exit-code; then
            echo 'ERROR: There are uncommitted changes after build/gen. Please commit the changes.';
            git status --short
            exit 1;
          fi

      - name: Resolve release projects
        id: release-projects
        if: ${{ steps.setup-vars.outputs.SHOULD_RELEASE == 'true' }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_ALL: ${{ github.event.inputs.releaseAll }}
          INPUT_RELEASE_WEB: ${{ github.event.inputs.releaseWeb }}
          INPUT_RELEASE_NOTE: ${{ github.event.inputs.releaseNote }}
          INPUT_RELEASE_AUTHORIZATION: ${{ github.event.inputs.releaseAuthorization }}
          INPUT_RELEASE_BILLING: ${{ github.event.inputs.releaseBilling }}
          INPUT_RELEASE_DOC: ${{ github.event.inputs.releaseDocument }}
          INPUT_RELEASE_SW: ${{ github.event.inputs.releaseSearchWorker }}
        run: |
          projects="$(bash scripts/resolve-release-projects.sh)"
          echo "RELEASE_PROJECTS=$projects" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        if: ${{ steps.release-projects.outputs.RELEASE_PROJECTS != '' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: setup-buildx
        if: ${{ steps.release-projects.outputs.RELEASE_PROJECTS != '' }}

      - name: Release selected Docker images
        if: ${{ steps.release-projects.outputs.RELEASE_PROJECTS != '' }}
        env:
          RELEASE_PROJECTS: ${{ steps.release-projects.outputs.RELEASE_PROJECTS }}
          RELEASE_CONTAINER_TYPE: ${{ github.event.inputs.releaseContainerType }}
          BUILDX_BUILDER: ${{ steps.setup-buildx.outputs.name }}
          DOCKER_BUILDKIT: 1
          NX_CACHE_ACTION_SKIP_UPLOAD_CACHE: ${{ steps.setup-vars.outputs.NX_CACHE_ACTION_SKIP_UPLOAD_CACHE }}
        run: |
          echo "RELEASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          snapshot="$RUNNER_TEMP/release-tags-before.txt"
          git tag --list > "$snapshot"
          echo "RELEASE_TAGS_BEFORE=$snapshot" >> "$GITHUB_ENV"
          echo "RELEASE_TAGS_FILE=$RUNNER_TEMP/release-tags.txt" >> "$GITHUB_ENV"
          nx-cache-action -- \
            pnpm exec nx run-many --projects "$RELEASE_PROJECTS" \
              --target docker:build \
              --parallel=${{ env.NX_PARALLEL }} \
              --configuration production
          pnpm exec nx release --projects "$RELEASE_PROJECTS" \
            --dockerVersionScheme="$RELEASE_CONTAINER_TYPE" --yes

      - name: Bump deployment tags
        if: ${{ steps.release-projects.outputs.RELEASE_PROJECTS != '' }}
        env:
          RELEASE_PROJECTS: ${{ steps.release-projects.outputs.RELEASE_PROJECTS }}
        run: bash scripts/bump-deploy-tags.sh "$RELEASE_HEAD" "$RELEASE_PROJECTS"

      - name: Push deployment tags and announce releases
        if: ${{ github.ref == 'refs/heads/main' && steps.setup-vars.outputs.SHOULD_RELEASE == 'true' && steps.release-projects.outputs.RELEASE_PROJECTS != '' }}
        env:
          RELEASE_PROJECTS: ${{ steps.release-projects.outputs.RELEASE_PROJECTS }}
        run: bash scripts/push-deploy-tags.sh "$RELEASE_HEAD" "$RELEASE_PROJECTS"

      - name: Github NPM Token
        if: >-
          ${{
            steps.setup-vars.outputs.SHOULD_RELEASE == 'true' &&
            (github.event.inputs.releaseNpm == 'true' || github.event.inputs.releaseAll == 'true')
          }}
        run: npm config set '//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}' --global

      - name: Release NPM packages
        if: >-
          ${{
            steps.setup-vars.outputs.SHOULD_RELEASE == 'true' &&
            (github.event.inputs.releaseNpm == 'true' || github.event.inputs.releaseAll == 'true')
          }}
        run: pnpm exec nx release --groups npm --yes

      # - name: Dispatch Update Deploy
      #   uses: benc-uk/workflow-dispatch@v1
      #   if: ${{ steps.setup-vars.outputs.SHOULD_RELEASE == 'true' }}
      #   with:
      #     workflow: update.yaml
      #     repo: ${{ github.repository_owner }}/infra
      #     token: ${{ steps.get-bot-token.outputs.token }}

  docs:
    name: Docs
    needs: main
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (needs.main.outputs.page-affected == 'true' || github.event.inputs.nxAllCmd == 'run-many')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      DOCS_KROKI_URL: http://localhost:8000
    services:
      kroki:
        image: yuzutech/kroki
        env:
          KROKI_LISTEN: 0.0.0.0:8000
        ports:
          - 8000:8000
    steps:
      - name: Setup Git User
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: "true"
          go: "true"

      - name: Restore Docs diagrams Cache
        id: diagrams-cache
        uses: actions/cache/restore@v6
        if: ${{ github.event.inputs.noRestoreDocsDiagramsCache != 'true' }}
        with:
          path: docs/src/public/diagrams/
          key: docs-diagrams-
          restore-keys: |
            docs-diagrams-

      - name: Nx reset cache
        if: ${{ github.event.inputs.resetNxCache == 'true' }}
        run: pnpm exec nx reset

      - name: Nx Build and Deploy Page
        run: |
          nx-cache-action -- \
          pnpm exec nx ${{ github.event.inputs.nxAllCmd || 'affected' }} \
            --target deployPage \
            --parallel=${{ env.NX_PARALLEL }} \
            --configuration 'production' \
            ${{ github.event.inputs.skipNxCache == 'true' && '--skipNxCache' || '' }}

      - name: Calculate Docs diagrams Cache Key
        id: cache-key
        run: |
          mkdir -p docs/src/public/diagrams
          hash="$(find docs/src/public/diagrams -type f -print0 | sort -z | xargs -0 -r sha256sum | sha256sum | cut -d ' ' -f 1)"
          echo "cache_key=docs-diagrams-$hash" >> "$GITHUB_OUTPUT"

      - name: Cache Docs diagrams
        if: ${{ steps.cache-key.outputs.cache_key != steps.diagrams-cache.outputs.cache-matched-key }}
        uses: actions/cache/save@v6
        with:
          path: docs/src/public/diagrams/
          key: ${{ steps.cache-key.outputs.cache_key }}
