name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      publish-web:
        description: Publish "web" container image
        required: true
        default: false
        type: boolean
      publish-note:
        description: Publish "note" container image
        required: true
        default: false
        type: boolean
      publish-document:
        description: Publish "document" container image
        required: true
        default: false
        type: boolean
      publish-npm-groups:
        description: Publish packages npm group
        required: true
        default: false
        type: boolean
      dry-run-release:
        description: Perform a Nx dry run release
        required: false
        default: false
        type: boolean

env:
  MISE_OVERRIDE_CONFIG_FILENAMES: .mise.ci.toml
  IS_RENOVATE: ${{ startsWith(github.head_ref || github.ref_name, 'renovate/') }}
  SHOULD_CACHE: >-
    ${{
      (
        github.ref_name == 'main' ||
        github.ref_name == 'dev' ||
        github.base_ref == 'main' ||
        github.base_ref == 'dev'
      ) && (
        !startsWith(github.head_ref || github.ref_name, 'renovate/')
      )
    }}
  WILL_RELEASE: >-
    ${{
      (
        github.event_name == 'push' || (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry-run-release == 'false'
        )
      ) && (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/dev'
      )
    }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  main:
    name: Main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: ${{ env.SHOULD_CACHE == 'true' }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: ${{ env.SHOULD_CACHE == 'true' && 'pnpm' || '' }}

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .tool-versions
          cache: ${{ env.SHOULD_CACHE == 'true' }}

      - name: Setup golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-only: true
          version-file: .tool-versions
          skip-save-cache: ${{ env.SHOULD_CACHE != 'true' }}

      - name: Setup Mise
        uses: jdx/mise-action@v3
        with:
          experimental: true
          cache: ${{ env.SHOULD_CACHE == 'true' }}

      - name: Cache Buf dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/buf
          key: ${{ runner.os }}-buf-${{ hashFiles('**/buf.lock') }}
          restore-keys: ${{ runner.os }}-buf-

      - name: Derive SHAs for Nx Affected
        id: set-shas
        uses: nrwl/nx-set-shas@v4

      - name: Restore Nx Cache
        uses: actions/cache/restore@v5
        with:
          path: .nx
          key: ${{ runner.os }}-nx-${{ github.ref_name }}-${{ steps.set-shas.outputs.base }}
          restore-keys: |
            ${{ runner.os }}-nx-${{ github.ref_name }}-
            ${{ runner.os }}-nx-${{ github.event.repository.default_branch }}-

      - name: Restore Docs diagrams Cache
        uses: actions/cache/restore@v5
        with:
          path: docs/src/public/diagrams/
          key: docs-diagrams-

      - name: Install Node Dependencies
        run: pnpm install

      - name: Install Go Dependencies
        run: go mod download

      - name: Nx Affected Test
        run: |
          npx nx affected \
            --target test \
            --parallel=2 \
            --base=${{ steps.set-shas.outputs.base }} \
            --head=${{ steps.set-shas.outputs.head }} \
            | true

      - name: Nx Affected Build, Lint, Format Check, Gen, Bundle
        run: |
          npx nx affected \
            --target lint \
            --target format:check \
            --target gen \
            --target bundle \
            --target build \
            ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && '--target docker:build' || '' }} \
            --parallel=2 \
            --base=${{ steps.set-shas.outputs.base }} \
            --head=${{ steps.set-shas.outputs.head }}

      - name: Check for Changes after Build/Gen
        run: |
          git add .
          if ! git diff --staged --exit-code --color-words; then
            echo "ERROR: There are uncommitted changes after build/gen. Please commit the changes.";
            git status --short --color=always
            exit 1;
          fi

      - name: Setup Git User
        if: >-
          ${{
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/dev'
          }}
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions [Bot]"

      - name: Nx release version
        if: >-
          ${{
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/dev'
          }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx nx release --skip-publish \
            --dockerVersionScheme=${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }} \
            ${{ env.WILL_RELEASE == 'true' && '' || '--dry-run' }}

      - name: Nx release publish
        if: >-
          ${{
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/dev'
          }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx nx release publish \
            ${{ (github.event_name == 'push' || github.event.inputs.publish-web == 'true') && '--project web' || '' }} \
            ${{ (github.event_name == 'push' || github.event.inputs.publish-note == 'true') && '--project note' || '' }} \
            ${{ (github.event_name == 'push' || github.event.inputs.publish-document == 'true') && '--project document' || '' }} \
            ${{ (github.ref_name == 'main' && (github.event_name == 'push' || github.event.inputs.publish-npm-groups == 'true')) && '--group npm' || '' }} \
            ${{ env.WILL_RELEASE == 'true' && '' || '--dry-run' }}

      - name: Cache Nx
        uses: actions/cache/save@v5
        if: ${{ env.SHOULD_CACHE == 'true' }}
        with:
          path: .nx
          key: ${{ runner.os }}-nx-${{ github.ref_name }}-${{ steps.set-shas.outputs.base }}

      - name: Cache Docs diagrams
        uses: actions/cache/save@v5
        if: ${{ env.SHOULD_CACHE == 'true' }}
        with:
          path: docs/src/public/diagrams/
          key: docs-diagrams-${{ hashFiles('docs/src/public/diagrams/**') }}
