#:schema https://raw.githubusercontent.com/jdx/mise/refs/heads/main/schema/mise.json

min_version = "2026.11.12"

[env]
REDOCLY_TELEMETRY = "off"
REDOCLY_SUPPRESS_UPDATE_NOTICE = "true"
NEXT_TELEMETRY_DISABLED = 1
MISE_EXPERIMENTAL = 1
'_'.path.paths = ["./scripts/"]

[tools]
actionlint = "1.7.12"
helm = "4.3.2"
"github:dadav/helm-schema" = "0.24.0"
"github:norwoodj/helm-docs" = "1.14.2"
"github:yannh/kubeconform" = "0.8.0"
yq = "4.54.3"
"github:pressly/goose" = "3.30.1"
"go:github.com/goforj/wire/cmd/wire" = "1.3.1"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "2.9.0"
buf = "1.75.0"
sqlc = "1.31.1"
java = "26.0.1"
mockery = "3.9.2"
d2 = "0.7.1"
gotestsum = "1.13.0"
"go:github.com/ctrf-io/go-ctrf-json-reporter/cmd/go-ctrf-json-reporter" = "0.4.0"
"github:pseudomuto/protoc-gen-doc" = "1.5.1"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"npm:ts-proto" = "2.23.9"
shellcheck = "0.11.0"
node = "26.13.1"
go = "1.27.4"

[shell_alias]
shadcn = "pnpm exec shadcn"

[settings]
lockfile = true
npm.package_manager = "aube"

[tool_config]
locked = true
