---
# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

linters:
  enable:
    - exhaustive
    - exhaustruct_v5
    - sloglint
    - tagalign
    - testifylint
    - unparam
  disable:
    - unused
  settings:
    tagalign:
      align: true
      sort: true
      strict: true
    exhaustruct_v5:
      explicit-mode: true
      allow-empty: false
      allow-empty-returns: true
      allow-empty-declarations: true
      enforce-patterns:
        - ^github\.com/notopia-uit/notopia/.+\..+$
      ignore-patterns:
        - ^github\.com/notopia-uit/notopia/.+/errs\.Err$
    sloglint:
      static-msg: true
      no-mixed-args: true
      attr-only: true
      args-on-sep-lines: true
      context: scope
  exclusions:
    generated: strict
    rules:
      - linters:
          - exhaustruct_v5
        path: _test\.go

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/notopia-uit
  exclusions:
    generated: strict

run:
  build-tags:
    - integration
